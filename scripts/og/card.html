<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url("../../public/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 800; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0b0d; }
  body { font-family: Inter, sans-serif; color: #f4f3ef; position: relative;
    background: radial-gradient(90% 120% at 72% 50%, rgba(91,63,214,.28), transparent 60%), #0b0b0d; }
  canvas { position: absolute; left: 520px; top: -45px; width: 720px; height: 720px; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .name { font: 600 22px/1 Inter; letter-spacing: .18em; text-transform: uppercase; color: #b4b3ae; }
  h1 { margin: 0; font: 800 82px/0.95 Inter; letter-spacing: -.045em; }
  .apps { font: 500 24px/1.3 Inter; color: #b4b3ae; }
  .apps b { font-weight: 600; white-space: nowrap; }
  .x { color: #8f7cf5; } .s { color: #b8902c; }
  .dev { position: absolute; width: 210px; aspect-ratio: 768/1670; border-radius: 22px; overflow: hidden; }
  .dev img { width: 100%; height: 100%; display: block; }
  .d1 { left: 690px; top: 58px; transform: rotate(-6deg); box-shadow: 0 0 0 2px rgba(91,63,214,.6), 0 30px 80px rgba(91,63,214,.45); }
  .d2 { left: 900px; top: 92px; transform: rotate(5deg); box-shadow: 0 0 0 2px rgba(184,144,44,.6), 0 30px 80px rgba(184,144,44,.4); }
  .url { position: absolute; left: 72px; bottom: 40px; font: 500 20px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; color: #8a8a93; }
</style>
<canvas id="c" width="1440" height="1440"></canvas>
<div class="copy">
  <div class="name">Vijay Goyal</div>
  <h1>I turn ideas into products.</h1>
  <div class="apps">Two iOS apps, built end to end: <b class="x">xBill</b> and <b class="s">The Shady Spade</b>.</div>
</div>
<div class="dev d1"><img src="../../src/assets/xbill-screen.webp" alt=""></div>
<div class="dev d2"><img src="../../src/assets/spade-screen.webp" alt=""></div>
<div class="url">vijaygoyal.org</div>
<script>
  // The site's lotus (src/scene/lotus.ts), drawn once as a still.
  const W = [
    { n: 16, len: .5, wide: .115, c: "#5b3fd6", a: .42, r: .3 },
    { n: 13, len: .405, wide: .125, c: "#b8902c", a: .46, r: -.2 },
    { n: 10, len: .315, wide: .135, c: "#c33a24", a: .52, r: .5 },
    { n: 7, len: .195, wide: .12, c: "#f4f3ef", a: .3, r: -.4 },
  ];
  const x = document.getElementById("c").getContext("2d");
  const R = 1440, cx = 720;
  W.forEach((w, i) => {
    const len = w.len * R * (.82 + i * .06), wide = w.wide * R * (.82 + i * .06);
    x.save(); x.translate(cx, cx); x.rotate(w.r); x.shadowColor = w.c; x.shadowBlur = 40;
    for (let k = 0; k < w.n; k++) {
      x.save(); x.rotate(k / w.n * Math.PI * 2);
      const g = x.createLinearGradient(0, 0, 0, -len);
      g.addColorStop(0, "rgba(11,11,13,0)"); g.addColorStop(.55, w.c); g.addColorStop(1, "rgba(244,243,239,.62)");
      x.globalAlpha = w.a * .8; x.fillStyle = g; x.beginPath(); x.moveTo(0, 0);
      x.bezierCurveTo(wide, -len * .34, wide * .62, -len * .84, 0, -len);
      x.bezierCurveTo(-wide * .62, -len * .84, -wide, -len * .34, 0, 0); x.fill(); x.restore();
    }
    x.restore();
  });
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
